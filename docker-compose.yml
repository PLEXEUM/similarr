services:
  similarr:
    image: plexeum/similarr:latest
    container_name: similarr
    restart: unless-stopped
    volumes:
      - ./config/.env:/app/config/.env:ro
      - ./logs:/app/logs
    environment:
      - TZ=America/New_York
      - CRON_SCHEDULE=0 2 * * *
      # For runtime filter, set MIN_RUNTIME=60 in your .env file
      # to skip movies under 60 minutes (shorts, specials, etc.)